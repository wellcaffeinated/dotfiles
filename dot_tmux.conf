# ==============================================
# Tmux Configuration
# ==============================================

# --- General Settings ---
set -g default-terminal "screen-256color"  # 256 color support
set -ga terminal-overrides ",xterm-256color*:Tc"  # True color support
set -g history-limit 50000  # Increase scrollback buffer
set -g display-time 4000  # Display messages for 4 seconds
set -g status-interval 5  # Refresh status bar every 5 seconds
set -g focus-events on  # Enable focus events
set -sg escape-time 10  # Faster command sequences
set -g mouse on  # Enable mouse support
setw -g mode-keys vi  # Use vi keybindings in copy mode

# --- Home/End Key Support ---
# Fix Home and End keys for various terminal types
bind-key -n Home send Escape "[H"
bind-key -n End send Escape "[F"
bind-key -T copy-mode-vi Home send -X start-of-line
bind-key -T copy-mode-vi End send -X end-of-line

# --- Prefix Key ---
# Change prefix from Ctrl-b to Ctrl-Space (more ergonomic)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Window and Pane Numbering ---
set -g base-index 1  # Start window numbering at 1
setw -g pane-base-index 1  # Start pane numbering at 1
set -g renumber-windows on  # Renumber windows when one is closed

# --- Window Management ---
bind c new-window -c "#{pane_current_path}"  # New window in current path
bind '"' split-window -c "#{pane_current_path}"  # Split horizontal in current path
bind % split-window -h -c "#{pane_current_path}"  # Split vertical in current path

# Better split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick window switching with Ctrl+j/k (no prefix needed)
bind-key -n C-j previous-window
bind-key -n C-k next-window

# --- Pane Navigation ---
# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind i select-pane -U  # Alternative up (above k on keyboard)
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r I resize-pane -U 5  # Alternative up resize
bind -r L resize-pane -R 5

# --- Copy Mode ---
bind Enter copy-mode  # Enter copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# --- Reload Configuration ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Status Bar ---
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour234 fg=colour137'

set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %m/%d #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=colour1 bg=colour238 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '

setw -g window-status-style 'fg=colour9 bg=colour236'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# --- Messages ---
set -g message-style 'fg=colour232 bg=colour166 bold'

# --- Pane Borders ---
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour51'

# --- Plugin Manager (TPM) ---
# Plugins will only be loaded if TPM is installed
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'  # Better copy/paste

# Plugin settings
set -g @continuum-restore 'off'  # Disabled - zshrc prompts for session restore
set -g @continuum-save-interval '15'  # Save every 15 minutes

# Initialize TPM (keep this line at the very bottom)
# This will fail silently if TPM is not installed
run '~/.tmux/plugins/tpm/tpm'
